name: Update price (hourly)

on:
  schedule:
    # Hourly, on the hour. GitHub Actions cron is UTC only — this runs all
    # day, every day.
    #
    # This used to be "every 30 min" (*/30 * * * *). GitHub's `schedule:`
    # trigger is best-effort, not exact, and sub-hourly cron gets deprioritized
    # the hardest — in practice we were seeing runs land 2-6+ hours apart
    # despite the 30-min setting, with the price on the site going stale for
    # hours with no visible warning. Hourly won't make GitHub's scheduler
    # exact either, but it's the honest cadence to advertise, and shorter
    # schedules are documented to slip more, not less.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-json-write
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price update
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: python docs/scripts/update_price.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/index.html is regenerated by render_index_html() every run
          # (static pre-render for crawlers) — must be staged explicitly,
          # same as docs/data.json, or it's silently discarded when the
          # runner is torn down.
          git add docs/data.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update price data [skip ci]"
          git push
