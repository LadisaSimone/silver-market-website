name: Update daily briefing (once/day)

on:
  schedule:
    # 13:30 UTC ≈ 9:30 AM ET (EDT). During EST (winter) this lands at
    # 8:30 AM ET instead — a ~1hr drift GitHub Actions' fixed-UTC cron
    # can't avoid without a second seasonal schedule. Fine for v1.
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-json-write
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python docs/scripts/update_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/index.html is regenerated by render_index_html() every run
          # (static pre-render for crawlers) and docs/metrics_history.json
          # is appended to by append_metrics_history() — both must be
          # staged explicitly, same as docs/data.json, or they're silently
          # discarded when the runner is torn down. `git add` before the
          # diff check (rather than after) so a brand-new, previously
          # untracked metrics_history.json is correctly detected as a
          # change via `--cached`, not missed by a pre-add `git diff`.
          git add docs/data.json docs/index.html docs/metrics_history.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update daily briefing [skip ci]"
          git push
