name: Update daily briefing (once/day)

on:
  schedule:
    # 13:30 UTC ≈ 9:30 AM ET (EDT). During EST (winter) this lands at
    # 8:30 AM ET instead — a ~1hr drift GitHub Actions' fixed-UTC cron
    # can't avoid without a second seasonal schedule. Fine for v1.
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-json-write
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python web/scripts/update_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/data.json; then
            echo "No changes."
            exit 0
          fi
          git add web/data.json
          git commit -m "Update daily briefing [skip ci]"
          git push
